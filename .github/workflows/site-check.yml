name: Site check

on:
  push:
    branches: [main, "arena/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Check every stylesheet, script, icon and precached file resolves
        run: npm run check

      - name: Brand config has not drifted from the static files
        run: npm run rebrand:check

      - name: Engine rules (turns, rounds, scoring, repeats, economy, powers)
        run: npm test

      - name: UI smoke test in a real DOM
        run: npm run test:ui

      - name: Two-client multiplayer sync
        run: npm run test:net
