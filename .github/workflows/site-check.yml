name: Site check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check that every stylesheet, script and icon resolves
        run: node scripts/check-site.mjs

      - name: Check JavaScript syntax
        run: |
          node --check js/game-engine.js
          node --check js/sound-engine.js
