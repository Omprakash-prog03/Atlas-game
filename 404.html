<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090A0D">
  <title>ATLAS — Page not found</title>
  <!--
    404 page for GitHub Pages.

    This page is served for ANY unknown URL on the site, at ANY depth
    (e.g. /Atlas-game/typo, /Atlas-game/a/b/c). All styles are inlined and the
    redirect target is resolved at runtime, so it works whether the site is
    hosted at a user root (https://user.github.io/) or a project subpath
    (https://user.github.io/repo/) — no hardcoded repository name.
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #090a0d;
      background-image: radial-gradient(circle at 50% 15%, rgba(229, 169, 60, 0.08) 0%, rgba(18, 20, 26, 0.8) 50%, #090a0d 100%);
      color: #f5f5f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      border-radius: 24px;
      background: rgba(23, 26, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .mark {
      width: 56px; height: 56px;
      margin: 0 auto 18px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(229, 169, 60, 0.2);
      border: 1px solid rgba(229, 169, 60, 0.5);
      color: #e5a93c;
      font-size: 26px;
      font-weight: 900;
    }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }
    p { margin: 0 0 22px; font-size: 13px; line-height: 1.6; color: #a8a29e; }
    a.btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 14px;
      background: #e5a93c;
      color: #090a0d;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-decoration: none;
    }
    a.btn:focus-visible { outline: 3px solid #f5c869; outline-offset: 3px; }
    .hint { margin: 16px 0 0; font-size: 11px; color: #78716c; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">&#9670;</div>
    <h1>Page not found</h1>
    <p>The page you were looking for does not exist. Taking you back to the game&hellip;</p>
    <a id="homeLink" class="btn" href="index.html">BACK TO ATLAS</a>
    <p class="hint" id="status">If nothing happens, use the button above.</p>
  </main>

  <noscript>
    <p class="hint">JavaScript is disabled — use the button above to open the game.</p>
  </noscript>

  <script>
    (function () {
      // Walk up from the requested URL until a directory containing index.html
      // is found. Works for project pages (/repo/...), user pages (/) and any
      // nesting depth, without hardcoding the repository name.
      var segments = location.pathname.split("/").filter(Boolean);
      var last = segments[segments.length - 1] || "";
      var start = /\.[a-z0-9]{1,8}$/i.test(last) ? segments.length - 1 : segments.length;

      function baseFor(depth) {
        return "/" + segments.slice(0, depth).join("/") + (depth ? "/" : "");
      }

      // Keep the no-JS fallback sensible: relative link from the current URL.
      document.getElementById("homeLink").setAttribute("href", "index.html");

      // Resolve with true only when <base>index.html exists.
      function probe(url) {
        return new Promise(function (resolveProbe) {
          var done = false;
          function finish(ok) {
            if (!done) { done = true; resolveProbe(ok); }
          }
          setTimeout(function () { finish(false); }, 4000);

          if (typeof fetch === "function") {
            fetch(url, { method: "HEAD", cache: "no-store" })
              .then(function (res) { finish(res.ok); })
              .catch(function () { finish(false); });
            return;
          }

          try {
            var xhr = new XMLHttpRequest();
            xhr.open("HEAD", url);
            xhr.onload = function () { finish(xhr.status >= 200 && xhr.status < 400); };
            xhr.onerror = function () { finish(false); };
            xhr.send();
          } catch (e) {
            finish(false);
          }
        });
      }

      function attempt(depth) {
        if (depth < 0) {
          document.getElementById("status").textContent = "Could not locate the game. Try the site's home page.";
          return;
        }
        var base = baseFor(depth);
        probe(base + "index.html").then(function (ok) {
          if (ok) {
            document.getElementById("homeLink").setAttribute("href", base + "index.html");
            document.getElementById("status").textContent = "Redirecting to " + base + "…";
            location.replace(base);
          } else {
            attempt(depth - 1);
          }
        });
      }

      attempt(start);
    })();
  </script>
</body>
</html>
