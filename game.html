<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ATLAS — Arena</title>
  <link rel="stylesheet" href="css/atlas.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Top Arena Header -->
    <header style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="index.html" style="text-decoration:none; color:#e5a93c; font-size:20px; font-weight:900;">ATLAS</a>
        <span id="roomPill" style="font-size:10px; font-weight:800; padding:2px 8px; border-radius:12px; background:#1e222d; color:#a8a29e; border:1px solid #2b303e;">AT7KQ</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:12px; font-weight:700; color:#a8a29e;">Round <strong id="roundDisplay" style="color:#f5f5f4;">01</strong></span>
        <button id="soundBtn" class="btn btn-secondary btn-icon" style="width:34px; height:34px; font-size:14px;">&#128266;</button>
      </div>
    </header>

    <!-- Feedback Banner -->
    <div id="feedbackBanner" style="display:none; text-align:center; padding:10px; border-radius:14px; font-size:12px; font-weight:800; margin: 8px 0;"></div>

    <!-- Chain & Letter Centerpiece -->
    <section style="display:flex; flex-direction:column; align-items:center; text-align:center; margin: auto 0; padding: 10px 0;">
      <div id="turnBadge" style="display:inline-block; padding: 4px 14px; border-radius:20px; background:#e5a93c; color:#090a0d; font-size:11px; font-weight:900; letter-spacing:1px; margin-bottom:6px;">
        YOUR TURN
      </div>

      <div class="letter-box animate-pulse-glow" id="letterBox">A</div>
      <span style="font-size:10px; font-weight:800; letter-spacing:1.5px; color:#a8a29e; text-transform:uppercase;">Starting Letter</span>

      <div style="margin-top:10px; font-size:12px; color:#a8a29e;">
        <span id="prevWordDisplay">Round opening word &middot; Category: <strong id="catText" style="color:#f5f5f4;">PLACES</strong></span>
      </div>

      <!-- Radial Timer Display -->
      <div style="display:flex; align-items:center; gap:10px; margin-top:12px;">
        <div style="width:48px; height:48px; border-radius:50%; border:3px solid #e5a93c; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px; color:#f5f5f4;" id="timerRing">
          15s
        </div>
        <div style="text-align:left;">
          <div style="font-size:10px; font-weight:700; color:#a8a29e; text-transform:uppercase;">Turn Timer</div>
          <div id="timerSubText" style="font-size:12px; font-weight:800; color:#e5a93c;">Think fast</div>
        </div>
      </div>
    </section>

    <!-- Interactive Input & Pass Controls -->
    <section style="display:flex; flex-direction:column; gap:10px; margin-bottom: 12px;">
      <form id="answerForm" style="display:flex; gap:8px;">
        <input id="answerInput" type="text" class="atlas-input" placeholder='Enter word starting with "A"...' autocomplete="off" spellcheck="false" style="font-size:18px; text-transform:uppercase;">
        <button type="submit" class="btn btn-primary" style="width:52px; height:52px; border-radius:16px; padding:0; font-size:18px;">
          &#10148;
        </button>
      </form>

      <!-- Passes Bar -->
      <div style="display:flex; justify-content:space-between; align-items:center; background:#12141a; border:1px solid #2b303e; border-radius:16px; padding:8px 14px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="font-size:11px; font-weight:700; color:#a8a29e; text-transform:uppercase;">Passes:</span>
          <div id="passDots" style="display:flex; gap:4px;">
            <span class="pass-dot filled"></span>
            <span class="pass-dot filled"></span>
            <span class="pass-dot filled"></span>
          </div>
        </div>
        <button id="passBtn" class="btn btn-secondary btn-sm" style="font-size:11px; height:32px;">Use Pass (3)</button>
      </div>
    </section>

    <!-- Scoreboard -->
    <footer style="border-top:1px solid rgba(255,255,255,0.08); padding-top:10px;">
      <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:#a8a29e; text-transform:uppercase; margin-bottom:6px;">
        <span>Scoreboard</span>
        <span id="survivorsCount">3 Active</span>
      </div>
      <div id="scoreboardList" style="display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto;">
        <!-- Scores populated by JS -->
      </div>
    </footer>
  </div>

  <!-- VOTING DISPUTE MODAL -->
  <div id="voteModal" class="modal-overlay">
    <div class="modal-card" style="text-align:center;">
      <div style="width:44px; height:44px; border-radius:14px; background:rgba(229,169,60,0.2); border:1px solid #e5a93c; display:flex; align-items:center; justify-content:center; color:#e5a93c; font-size:22px; margin:0 auto 10px;">
        &#9888;
      </div>
      <span style="font-size:10px; font-weight:900; letter-spacing:1.5px; color:#e5a93c; text-transform:uppercase;">Answer Under Review</span>
      <h2 id="voteWord" style="font-size:26px; font-weight:900; margin:8px 0; text-transform:uppercase;">&ldquo;TIMBUKTU&rdquo;</h2>
      <p id="voteSubText" style="font-size:12px; color:#a8a29e; margin-bottom:14px;">Challenged answer. Is this a valid location?</p>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button id="voteValidBtn" class="btn btn-secondary" style="border-color:#10b981; color:#10b981;">&#10003; VALID</button>
        <button id="voteInvalidBtn" class="btn btn-secondary" style="border-color:#ef4444; color:#ef4444;">&#10005; INVALID</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER / VICTORY MODAL -->
  <div id="gameOverModal" class="modal-overlay">
    <div class="modal-card" style="text-align:center;">
      <div style="font-size:48px; margin-bottom:6px;">&#127942;</div>
      <span style="font-size:10px; font-weight:900; letter-spacing:2px; color:#e5a93c; text-transform:uppercase;">Match Completed</span>
      <h2 id="winnerText" style="font-size:28px; font-weight:900; margin:4px 0 14px;">You Win!</h2>

      <div class="atlas-card" style="background:#171a22; padding:14px; text-align:left; margin-bottom:16px;">
        <div style="font-size:11px; font-weight:900; color:#e5a93c; text-transform:uppercase; margin-bottom:8px;">Final Ranking</div>
        <div id="finalRankList" style="display:flex; flex-direction:column; gap:6px; font-size:12px;"></div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
        <button id="shareScoreBtn" class="btn btn-secondary btn-sm" style="font-weight:700;">Share Result</button>
        <button id="copyScoreBtn" class="btn btn-secondary btn-sm" style="font-weight:700;">Copy Score</button>
      </div>

      <button id="playAgainBtn" class="btn btn-primary" style="width:100%; height:48px; font-size:15px;">&#8634; Play Again</button>
    </div>
  </div>

  <script src="js/sound-engine.js"></script>
  <script src="js/game-engine.js"></script>
  <script>
    const storedConfig = JSON.parse(localStorage.getItem("atlas_room_config") || '{"category":"PLACES","turnDurationSeconds":15,"code":"AT7KQ","hostNick":"Player"}');
    document.getElementById("roomPill").innerText = storedConfig.code;
    document.getElementById("catText").innerText = storedConfig.category;

    const initialPlayers = [
      { id: "p1", name: storedConfig.hostNick || "You", score: 0, passes: 3, strikes: 0, streak: 0, bestStreak: 0, eliminated: false },
      { id: "p2", name: "Elena", score: 0, passes: 3, strikes: 0, streak: 0, bestStreak: 0, eliminated: false },
      { id: "p3", name: "Kenji", score: 0, passes: 3, strikes: 0, streak: 0, bestStreak: 0, eliminated: false }
    ];

    const game = new AtlasGameEngine(storedConfig.code, storedConfig, initialPlayers);

    // Timer Ticker
    setInterval(() => {
      if (game.status === "PLAYER_TURN") {
        const ms = game.deadlineTimestamp - Date.now();
        const sec = Math.max(0, Math.ceil(ms / 1000));
        const ring = document.getElementById("timerRing");
        ring.innerText = sec + "s";

        if (sec <= 5) {
          ring.style.borderColor = "#ef4444";
          ring.style.color = "#ef4444";
          document.getElementById("timerSubText").innerText = "Hurry up!";
          document.getElementById("timerSubText").style.color = "#ef4444";
          if (game.players[game.activePlayerIndex].id === "p1") SoundEngine.playTimerTick(true);
        } else {
          ring.style.borderColor = "#e5a93c";
          ring.style.color = "#f5f5f4";
          document.getElementById("timerSubText").innerText = "Think fast";
          document.getElementById("timerSubText").style.color = "#e5a93c";
        }

        if (sec === 0) {
          game.handleTimeout();
        }
      }
    }, 500);

    // Subscribe to state updates
    game.subscribe(state => {
      document.getElementById("roundDisplay").innerText = String(state.roundNumber).padStart(2, "0");
      document.getElementById("letterBox").innerText = state.requiredLetter;
      document.getElementById("answerInput").placeholder = `Enter ${state.config.category.toLowerCase()} starting with "${state.requiredLetter}"...`;

      const isMyTurn = state.activePlayer.id === "p1";
      const badge = document.getElementById("turnBadge");
      badge.innerText = isMyTurn ? "YOUR TURN" : `${state.activePlayer.name.toUpperCase()}'S TURN`;
      badge.style.background = isMyTurn ? "#e5a93c" : "#1e222d";
      badge.style.color = isMyTurn ? "#090a0d" : "#a8a29e";

      if (state.lastAcceptedWord) {
        document.getElementById("prevWordDisplay").innerHTML = `Previous: <strong style="color:#f5f5f4; text-transform:uppercase;">${state.lastAcceptedWord.word}</strong> <span style="font-size:11px; color:#78716c;">(by ${state.lastAcceptedWord.submittedBy})</span>`;
      }

      // Passes
      const myPlayer = state.players.find(p => p.id === "p1");
      const dotsEl = document.getElementById("passDots");
      dotsEl.innerHTML = "";
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("span");
        dot.className = "pass-dot" + (i < myPlayer.passes ? " filled" : "");
        dotsEl.appendChild(dot);
      }
      document.getElementById("passBtn").innerText = `Use Pass (${myPlayer.passes})`;
      document.getElementById("passBtn").disabled = !isMyTurn || myPlayer.passes <= 0;

      // Scoreboard
      const listEl = document.getElementById("scoreboardList");
      listEl.innerHTML = "";
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      sorted.forEach(p => {
        const row = document.createElement("div");
        const isActive = p.id === state.activePlayer.id;
        row.style.display = "flex";
        row.style.justifyContent = "space-between";
        row.style.alignItems = "center";
        row.style.padding = "6px 12px";
        row.style.borderRadius = "12px";
        row.style.background = p.eliminated ? "rgba(255,255,255,0.02)" : (isActive ? "rgba(229,169,60,0.12)" : "#171a22");
        row.style.border = isActive ? "1px solid rgba(229,169,60,0.4)" : "1px solid #2b303e";
        row.style.opacity = p.eliminated ? "0.4" : "1";
        row.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-weight:700; color:${p.id === 'p1' ? '#e5a93c' : '#f5f5f4'};">${p.name} ${p.id === 'p1' ? '(YOU)' : ''}</span>
            ${p.streak >= 2 && !p.eliminated ? `<span style="color:#f59e0b; font-size:10px; font-weight:700;">&#128293; ${p.streak}</span>` : ''}
            ${p.eliminated ? '<span style="color:#ef4444; font-size:10px; font-weight:700;">Eliminated</span>' : ''}
          </div>
          <strong style="color:#f5f5f4; font-size:13px;">${p.score} PTS</strong>
        `;
        listEl.appendChild(row);
      });

      // Voting Modal
      const voteModal = document.getElementById("voteModal");
      if (state.status === "VOTING_PERIOD" && state.activeDispute) {
        document.getElementById("voteWord").innerText = `“${state.activeDispute.word}”`;
        voteModal.classList.add("active");
      } else {
        voteModal.classList.remove("active");
      }

      // Game Over
      const gameOverModal = document.getElementById("gameOverModal");
      if (state.status === "GAME_OVER") {
        gameOverModal.classList.add("active");
        SoundEngine.playFanfare();
        if (typeof confetti !== "undefined") {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
        document.getElementById("winnerText").innerText = `${state.winner.name} Wins!`;
        const rankList = document.getElementById("finalRankList");
        rankList.innerHTML = sorted.map((p, idx) => `
          <div style="display:flex; justify-content:space-between; padding:4px 0;">
            <span>${idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉'} ${p.name}</span>
            <strong>${p.score} PTS</strong>
          </div>
        `).join("");
      }
    });

    // Submit Answer
    document.getElementById("answerForm").onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById("answerInput");
      const word = input.value.trim();
      if (!word) return;

      const res = game.submitAnswer("p1", word);
      input.value = "";

      const banner = document.getElementById("feedbackBanner");
      if (res.success) {
        SoundEngine.playValidChime();
        banner.style.display = "block";
        banner.style.background = "rgba(16, 185, 129, 0.2)";
        banner.style.border = "1px solid #10b981";
        banner.style.color = "#10b981";
        banner.innerText = `✓ VALID ${word.toUpperCase()} (+${res.points || 10} PTS)`;
      } else {
        SoundEngine.playInvalidBuzz();
        banner.style.display = "block";
        banner.style.background = "rgba(239, 68, 68, 0.2)";
        banner.style.border = "1px solid #ef4444";
        banner.style.color = "#ef4444";
        banner.innerText = `✕ ${res.error}`;
      }
      setTimeout(() => banner.style.display = "none", 3000);
    };

    // Pass
    document.getElementById("passBtn").onclick = () => {
      SoundEngine.playClick();
      game.usePass("p1");
    };

    // Voting Buttons
    document.getElementById("voteValidBtn").onclick = () => {
      SoundEngine.playClick();
      game.resolveDispute(true);
    };
    document.getElementById("voteInvalidBtn").onclick = () => {
      SoundEngine.playClick();
      game.resolveDispute(false);
    };

    // Rematch
    document.getElementById("playAgainBtn").onclick = () => {
      window.location.reload();
    };

    // Sound toggle
    document.getElementById("soundBtn").onclick = () => {
      SoundEngine.enabled = !SoundEngine.enabled;
      document.getElementById("soundBtn").innerHTML = SoundEngine.enabled ? "&#128266;" : "&#128263;";
    };
  </script>
</body>
</html>
