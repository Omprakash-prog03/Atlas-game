<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ATLAS — Matchmaking Lounge</title>
  <meta name="description" content="ATLAS matchmaking lounge. Share your room code and start the match.">
  <meta name="theme-color" content="#090A0D">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/atlas.css?v=2">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0;">
      <a href="index.html" style="text-decoration:none; color:#e5a93c; font-size:22px; font-weight:900;">ATLAS</a>
      <span style="font-size:12px; font-weight:700; color:#a8a29e;">Lounge</span>
    </header>

    <!-- Room Code Card -->
    <section class="atlas-card glow" style="text-align:center; margin: 12px 0;">
      <span style="font-size:11px; font-weight:900; letter-spacing:2px; color:#e5a93c;">ROOM CODE</span>
      <h1 id="roomCodeDisplay" style="font-size:42px; font-weight:900; letter-spacing:4px; font-family:monospace; margin: 6px 0; color:#f5f5f4;">AT7KQ</h1>
      <p style="font-size:12px; color:#a8a29e; margin-bottom:14px;">Share this code with friends to join</p>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button id="copyCodeBtn" class="btn btn-secondary btn-sm" style="font-weight:700;">Copy Code</button>
        <button id="shareLinkBtn" class="btn btn-secondary btn-sm" style="font-weight:700; color:#e5a93c;">Share Link</button>
      </div>
    </section>

    <!-- Config Pill -->
    <div style="display:flex; justify-content:space-around; align-items:center; background:#12141a; border:1px solid #2b303e; border-radius:16px; padding:10px 14px; margin-bottom:14px; font-size:12px;">
      <div style="text-align:center;">
        <span style="display:block; font-size:9px; color:#a8a29e; font-weight:700; text-transform:uppercase;">Category</span>
        <strong id="catDisplay" style="color:#f5f5f4;">PLACES</strong>
      </div>
      <div style="width:1px; height:20px; background:#2b303e;"></div>
      <div style="text-align:center;">
        <span style="display:block; font-size:9px; color:#a8a29e; font-weight:700; text-transform:uppercase;">Timer</span>
        <strong id="timerDisplay" style="color:#f5f5f4;">15s</strong>
      </div>
      <div style="width:1px; height:20px; background:#2b303e;"></div>
      <div style="text-align:center;">
        <span style="display:block; font-size:9px; color:#a8a29e; font-weight:700; text-transform:uppercase;">Passes</span>
        <strong style="color:#f5f5f4;">3</strong>
      </div>
    </div>

    <!-- Players List -->
    <section style="flex:1; display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 4px;">
        <span style="font-size:12px; font-weight:700; text-transform:uppercase; color:#a8a29e;">Players (3 / 8)</span>
        <span style="font-size:11px; color:#78716c;">Min 3 required</span>
      </div>

      <div id="playerList" style="display:flex; flex-direction:column; gap:8px;">
        <!-- Player Cards populated by JS -->
      </div>
    </section>

    <!-- Footer Action -->
    <footer style="margin-top:16px;">
      <button id="startMatchBtn" class="btn btn-primary" style="width:100%; height:54px; font-size:16px; letter-spacing:0.5px;">
        &#9654; START MATCH NOW
      </button>
    </footer>
  </div>

  <script src="js/sound-engine.js?v=2"></script>
  <script src="js/game-engine.js?v=2"></script>
  <script>
    // Safe config loading: corrupt or blocked localStorage must never blank the page.
    const DEFAULT_CONFIG = { category: "PLACES", turnDurationSeconds: 15, maxPasses: 3, code: "AT7KQ", hostNick: "Player" };
    const storedConfig = (function () {
      try {
        const parsed = JSON.parse(localStorage.getItem("atlas_room_config") || "null");
        return Object.assign({}, DEFAULT_CONFIG, parsed && typeof parsed === "object" ? parsed : {});
      } catch (e) {
        return Object.assign({}, DEFAULT_CONFIG);
      }
    })();

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      return new Promise(function (resolve, reject) {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.top = "-1000px";
        document.body.appendChild(area);
        area.select();
        try {
          document.execCommand("copy") ? resolve() : reject(new Error("copy failed"));
        } catch (err) {
          reject(err);
        } finally {
          document.body.removeChild(area);
        }
      });
    }

    document.getElementById("roomCodeDisplay").innerText = storedConfig.code;
    document.getElementById("catDisplay").innerText = storedConfig.category;
    document.getElementById("timerDisplay").innerText = storedConfig.turnDurationSeconds + "s";

    const players = [
      { id: "p1", name: storedConfig.hostNick || "You", isHost: true, isReady: true },
      { id: "p2", name: "Elena", isHost: false, isReady: true },
      { id: "p3", name: "Kenji", isHost: false, isReady: true }
    ];

    const listEl = document.getElementById("playerList");
    players.forEach((p, idx) => {
      const card = document.createElement("div");
      card.className = "atlas-card";
      card.style.padding = "12px 16px";
      card.style.display = "flex";
      card.style.justifyContent = "space-between";
      card.style.alignItems = "center";
      card.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="width:36px; height:36px; border-radius:12px; background:#1e222d; display:flex; align-items:center; justify-content:center; font-weight:900; color:#f5f5f4;">
            ${p.name.slice(0, 2).toUpperCase()}
          </div>
          <div>
            <div style="font-size:13px; font-weight:700; color:#f5f5f4;">${p.name} ${p.isHost ? '<span style="color:#e5a93c;">&#128081;</span>' : ''}</div>
            <div style="font-size:10px; color:#78716c;">Seat #${idx + 1}</div>
          </div>
        </div>
        <span style="font-size:11px; font-weight:700; color:#10b981;">&#10003; Ready</span>
      `;
      listEl.appendChild(card);
    });

    document.getElementById("copyCodeBtn").onclick = () => {
      SoundEngine.playClick();
      const btn = document.getElementById("copyCodeBtn");
      copyText(storedConfig.code)
        .then(() => { btn.innerText = "Copied!"; })
        .catch(() => { btn.innerText = "Copy failed"; })
        .finally(() => setTimeout(() => (btn.innerText = "Copy Code"), 2000));
    };

    document.getElementById("shareLinkBtn").onclick = () => {
      SoundEngine.playClick();
      const url = window.location.origin + window.location.pathname.replace("lobby.html", "index.html");
      if (navigator.share) {
        navigator.share({ title: "ATLAS Game", text: "Join room " + storedConfig.code, url: url }).catch(() => {});
      } else {
        const btn = document.getElementById("shareLinkBtn");
        copyText(url)
          .then(() => { btn.innerText = "Copied URL!"; })
          .catch(() => { btn.innerText = "Share failed"; })
          .finally(() => setTimeout(() => (btn.innerText = "Share Link"), 2000));
      }
    };

    document.getElementById("startMatchBtn").onclick = () => {
      SoundEngine.playFanfare();
      window.location.href = "game.html";
    };
  </script>
</body>
</html>
